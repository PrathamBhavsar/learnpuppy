[dependencies]
lp-core = { path = "../lp-core" }
lp-store = { path = "../lp-store" }
lp-cli-driver = { path = "../lp-cli-driver" }
lp-agent = { path = "../lp-agent" }
lp-ingest = { path = "../lp-ingest" }
