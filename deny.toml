[advisories]
version = 2

[licenses]
version = 2
# MPL-2.0 (scraper's cssparser/selectors): file-level weak copyleft, used unmodified.
# CDLA-Permissive-2.0: webpki-roots CA data.
# Apache-2.0 WITH LLVM-exception, BSL-1.0: permissive licenses in transitive deps.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
