[advisories]
version = 2
ignore = [
    # chrono: unmaintained notice only (no vulnerability); used for timestamps in 4 crates.
    # Revisit: migrate to jiff or time before v0.1.0 final.
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
# MPL-2.0 (scraper's cssparser/selectors): file-level weak copyleft, used unmodified.
# CDLA-Permissive-2.0: webpki-roots CA data.
# Apache-2.0 WITH LLVM-exception, BSL-1.0, Zlib: permissive licenses in transitive deps (Zlib: foldhash, via rusqlite).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
