[advisories]
version = 2
# paste is unmaintained (RUSTSEC-2024-0436); only reachable via ratatui 0.29, no fix upstream yet.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
version = 2
allow = ["Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "MIT", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
