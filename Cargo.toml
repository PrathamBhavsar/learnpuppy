[workspace]
resolver = "2"
members = ["crates/lp-core", "crates/lp-store", "crates/lp-cli-driver", "crates/lp-agent", "crates/lp-ingest", "crates/lp-service", "crates/lp-server"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/PrathamBhavsar/learnpuppy"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
disallowed_methods = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "0.8", features = ["derive", "uuid1", "chrono"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
smol_str = { version = "0.3", features = ["serde"] }
parking_lot = "0.12"
sha2 = "0.10"
hex = "0.4"
rand = { version = "0.8", features = ["small_rng"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
scraper = "0.29"
proptest = "1"
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
